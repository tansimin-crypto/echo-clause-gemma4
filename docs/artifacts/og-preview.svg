    <rect x="80" y="580" width="280" height="36" rx="18" fill="rgba(245,158,11,0.25)" stroke="#f59e0b"/>
    <text x="220" y="603" text-anchor="middle" font-size="14" font-weight="600" fill="#fde68a">RECORDED GEMMA 4 REPLAY</text>
  </g>
