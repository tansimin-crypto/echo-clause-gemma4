<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="EchoClause social preview">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#hero-bg)"/>
  <circle cx="1050" cy="80" r="180" fill="#14b8a6" opacity="0.15"/>
  <circle cx="150" cy="550" r="220" fill="#f59e0b" opacity="0.1"/>

  <g font-family="DM Sans, system-ui, sans-serif">
    <rect x="80" y="80" width="56" height="56" rx="12" fill="url(#accent)"/>
    <text x="108" y="118" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">E</text>
    <text x="160" y="118" font-size="42" font-weight="700" fill="#fff">EchoClause</text>

    <text x="80" y="220" font-size="52" font-weight="700" fill="#fff">What they said</text>
    <text x="80" y="290" font-size="52" font-weight="700" fill="#fff">versus what you sign.</text>

    <text x="80" y="360" font-size="24" fill="#99f6e4">Record the pitch · Photograph the contract · See every mismatch</text>

    <g transform="translate(80, 400)">
      <rect width="520" height="160" rx="16" fill="rgba(255,255,255,0.95)"/>
      <text x="24" y="36" font-size="14" font-weight="700" fill="#64748b">NURU CREDIT DEMO · 5 CONTRADICTIONS</text>
      <rect x="24" y="52" width="220" height="88" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="36" y="76" font-size="11" font-weight="700" fill="#059669">PROMISE</text>
      <text x="36" y="98" font-size="13" fill="#0f172a">"No hidden fees"</text>
      <text x="36" y="122" font-size="11" fill="#64748b">Advertisement</text>
      <rect x="260" y="52" width="236" height="88" rx="10" fill="#fef2f2" stroke="#fecaca"/>
      <text x="272" y="76" font-size="11" font-weight="700" fill="#dc2626">CONTRACT</text>
      <text x="272" y="98" font-size="13" fill="#0f172a">"Platform fee: $150"</text>
      <text x="272" y="122" font-size="11" fill="#64748b">Loan agreement</text>
