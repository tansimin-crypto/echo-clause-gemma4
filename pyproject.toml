[project]
name = "echo-clause-gemma4"
version = "0.1.0"
description = "EchoClause — What They Said vs. What You Sign (Gemma 4 hackathon MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
ui = [
    "gradio>=4.0",
]
gemma = [
    "torch>=2.2",
    "transformers>=5.14",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    "httpx[socks]>=0.27",
]

[project.scripts]
echo-clause = "app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echo_clause*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "artifacts",
    "notebooks/_kaggle_bundle",
    "notebooks/_kaggle_dataset",
    ".pytest_cache",
    "*.egg-info",
]

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510", "SIM103"]
